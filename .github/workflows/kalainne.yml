name: Kalainne maps

on:
  pull_request:
    paths:
      - 'integrations/kalainne/**'
      - 'archify/**'
      - '.agents/skills/kalainne-archify/**'
      - '.cursor/rules/kalainne-archify.mdc'
      - '.github/workflows/kalainne.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/kalainne/**'
      - 'archify/**'
      - '.agents/skills/kalainne-archify/**'
      - '.cursor/rules/kalainne-archify.mdc'
      - '.github/workflows/kalainne.yml'
  workflow_dispatch:

concurrency:
  group: kalainne-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    name: Showcase maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # package.json pins pnpm; without this, setup-node looks for a pnpm binary first.
          package-manager-cache: false
      - uses: ./.github/actions/setup-pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Kalainne maps
        run: node --test integrations/kalainne/test/*.test.mjs
